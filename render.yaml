services:
  - type: web
    name: ai-citizen-assistant
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: "7860"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: RETRIEVAL_MODE
        value: hybrid
