[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "instance", "chroma_db", "data/samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
