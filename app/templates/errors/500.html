{% extends "base.html" %}
{% block title %}Something went wrong — {{ t.app_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:40px auto;text-align:center;">
  <h1>Something went wrong</h1>
  <p class="muted">Please try again in a moment or go back to the home page.</p>
  <div style="margin-top:20px;">
    <a href="{{ url_for('pages.index') }}" class="btn btn-primary">{{ t.errors.back_home }}</a>
  </div>
</div>
{% endblock %}
