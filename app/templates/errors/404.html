{% extends "base.html" %}
{% block title %}{{ t.errors.not_found_title }} — {{ t.app_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:40px auto;text-align:center;">
  <h1>{{ t.errors.not_found_title }}</h1>
  <p class="muted">{{ t.errors.not_found_body }}</p>
  <div style="margin-top:20px;">
    <a href="{{ url_for('pages.index') }}" class="btn btn-primary">{{ t.errors.back_home }}</a>
  </div>
</div>
{% endblock %}
