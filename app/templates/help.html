{% extends "base.html" %}
{% block title %}{{ t.help.title }} — {{ t.app_name }}{% endblock %}
{% block content %}
<div style="max-width:820px;margin:0 auto;">
  <h1>{{ t.help.title }}</h1>
  <p class="muted">{{ t.help.subtitle }}</p>

  <div class="grid" style="margin-top:20px;">
    {% for item in t.home.faq %}
    <div class="card">
      <h3>{{ item.q }}</h3>
      <p class="muted" style="margin:0;">{{ item.a }}</p>
    </div>
    {% endfor %}
  </div>

  <div class="alert-warn" style="margin-top:24px;">
    <div>
      <strong>{{ t.home.fraud_title }}</strong>
      <p style="margin:4px 0 0;">{{ t.home.fraud_body }}</p>
    </div>
  </div>
</div>
{% endblock %}
